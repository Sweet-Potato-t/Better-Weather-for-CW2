name: Bug report
description: Report a reproducible problem with Better Weather for CW2
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please include enough detail to reproduce the issue.
  - type: input
    id: cw2-version
    attributes:
      label: Class Widgets 2 version
      placeholder: e.g. 2.0.0
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Better Weather version
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Weather source
      options:
        - Open-Meteo
        - Xiaomi Weather
        - wttr.in
        - MET Norway
        - QWeather
        - OpenWeatherMap
        - WeatherAPI
        - Caiyun
        - Not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Remove API keys, precise coordinates, and other private data first.
      render: text
